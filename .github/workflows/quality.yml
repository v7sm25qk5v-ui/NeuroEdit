name: Quality checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test-and-lint:
    name: Test and lint desktop app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              expected = "v" + tomllib.load(handle)["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != expected and not tag.startswith(expected + "-"):
              raise SystemExit(f"Release tag {tag!r} does not match project version {expected!r}")
          PYCODE
      - name: Install desktop app with dev dependencies
        working-directory: desktop
        run: python -m pip install -c requirements-release.txt -e ".[dev]"
      - name: Expose bundled FFmpeg for integration tests
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import imageio_ffmpeg

          ffmpeg_dir = Path(os.environ["RUNNER_TEMP"]) / "neuroedit-bin"
          ffmpeg_dir.mkdir(parents=True, exist_ok=True)
          (ffmpeg_dir / "ffmpeg").symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              handle.write(f"{ffmpeg_dir}\n")
          PY
      - name: Ruff
        working-directory: desktop
        run: ruff check src tests scripts
      - name: Pytest
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
          PYTHONUNBUFFERED: "1"
        run: python -m pytest tests/ -q -o faulthandler_timeout=120

  # INFORMATIONAL ONLY: the suite has never been run on Windows, so failures here
  # are expected at first. continue-on-error keeps this job from failing the run,
  # and no other job lists it in `needs`, so it cannot block a release.
  # Remove continue-on-error once this job is green.
  test-and-lint-windows:
    name: Test and lint desktop app (Windows, informational)
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install desktop app with dev dependencies
        working-directory: desktop
        run: python -m pip install -c requirements-release.txt -e ".[dev]"
      - name: Expose bundled FFmpeg for integration tests
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          $dir = Join-Path $env:RUNNER_TEMP "neuroedit-bin"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $ffmpeg (Join-Path $dir "ffmpeg.exe")
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Ruff
        working-directory: desktop
        run: ruff check src tests scripts
      - name: Pytest
        working-directory: desktop
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: ffmpeg
          PYTHONUNBUFFERED: "1"
        run: python -m pytest tests/ -q -o faulthandler_timeout=120
