name: Build installers

# Build the macOS .dmg and the Windows Setup.exe from the SAME commit, so every
# change to the shared desktop/src code ships to both platforms at once.
#
#   - Push a version tag (e.g. `git tag v0.2.0 && git push --tags`) to build
#     both installers AND publish them to a GitHub Release.
#   - Or trigger manually (Actions tab -> Run workflow) to build test artifacts
#     without cutting a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the build (e.g. v0.2.0)"
        default: "dev"

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  macos:
    name: Build macOS (.dmg)
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build unsigned macOS installer
        working-directory: desktop
        env:
          BUILD_LABEL: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          chmod +x scripts/build_alpha_macos.sh
          ./scripts/build_alpha_macos.sh "$BUILD_LABEL"
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-installers
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
          if-no-files-found: error

  windows:
    name: Build Windows (Setup.exe)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --version=6.7.1 -y --no-progress
      - name: Build unsigned Windows installer
        working-directory: desktop
        shell: pwsh
        env:
          BUILD_LABEL: ${{ github.event.inputs.version || github.ref_name }}
        run: .\scripts\build_alpha_windows.ps1 -Version $env:BUILD_LABEL
      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Create / update the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Feature the current build in the repository's Releases sidebar.
          # Keep alpha status in the tag/notes; GitHub excludes prereleases from Latest.
          prerelease: false
          make_latest: "true"
          files: artifacts/**/*
          fail_on_unmatched_files: true
          body: |
            Unsigned NeuroEdit build.

            - **macOS**: download the `.dmg`. First launch: right-click the app -> Open.
            - **Windows**: download the `-Windows-Setup.exe`. First launch: if SmartScreen
              warns, click "More info" -> "Run anyway".

            Both installers are built from the same commit and are functionally identical.
      - name: Verify the repository's Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')
          test "$latest_tag" = "$RELEASE_TAG"
